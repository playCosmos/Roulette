name: Ramyani Game Server Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "games/board/**"
      - "assets/**"
      - "soop-overlay.html"
      - "soop-admin.html"
      - "soop-channel.html"
      - "soop/**"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check soop/admin/soop-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/channel/soop-channel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/overlay/soop-overlay-connection.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/overlay/soop-overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/overlay/soop-overlay-archive.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/admin/board-room-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/throw-presentation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/board.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/board-rect.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build server
        working-directory: bridge
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run server self-tests
        working-directory: bridge
        shell: pwsh
        run: |
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --phase-d-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --phase-e-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --phase-f-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --encoding-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --room-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --board-runtime-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows portable app
        working-directory: bridge
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.2.0 -SkipBuild

      - name: Verify packaged executable and config
        working-directory: bridge
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/RamyaniGameServer"
          $exe = Join-Path $root "RamyaniGameServer.exe"
          $config = Join-Path $root "config.json"
          $runtime = Join-Path $root "runtime/bin/server/jvm.dll"
          if (-not (Test-Path $exe)) { throw "RamyaniGameServer.exe missing" }
          if (-not (Test-Path $config)) { throw "config.json missing" }
          if (-not (Test-Path $runtime)) { throw "bundled Java runtime missing" }
          if (-not (Test-Path (Join-Path $root "restart-server.ps1"))) { throw "restart-server.ps1 missing from package" }
          $configJson = Get-Content $config -Raw | ConvertFrom-Json
          if (-not [string]::IsNullOrWhiteSpace([string]$configJson.streamerId)) { throw "distribution streamerId must be empty" }
          if ([string]$configJson.ticket.issuanceMode -ne "single_donation") { throw "distribution issuanceMode must default to single_donation" }
          @(
            "web/soop-admin.html",
            "web/soop/admin/soop-admin.js",
            "web/soop/admin/soop-admin.css",
            "web/soop-channel.html",
            "web/soop/channel/soop-channel.js",
            "web/soop/channel/soop-channel.css",
            "web/soop/overlay/soop-overlay-connection.js",
            "web/soop/overlay/soop-overlay.js",
            "web/soop/overlay/soop-overlay-archive.js",
            "web/soop/admin/board-room-admin.js",
            "web/soop/admin/board-room-admin.css",
            "web/games/board/index.html",
            "web/games/board/rect.html",
            "web/games/board/js/board.js",
            "web/games/board/js/board-rect.js",
            "web/games/board/js/throw-presentation.js"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "required packaged asset missing: $_" }
          }
          if (Test-Path (Join-Path $root "logs")) { throw "logs directory must not be pre-created in distribution" }

          $phaseF = Start-Process -FilePath $exe -ArgumentList "--phase-f-probe" -Wait -PassThru
          if ($phaseF.ExitCode -ne 0) { throw "packaged RamyaniGameServer.exe self-test failed: $($phaseF.ExitCode)" }
          $encoding = Start-Process -FilePath $exe -ArgumentList "--encoding-probe" -Wait -PassThru
          if ($encoding.ExitCode -ne 0) { throw "packaged RamyaniGameServer.exe encoding test failed: $($encoding.ExitCode)" }
          $roomProbe = Start-Process -FilePath $exe -ArgumentList "--room-probe" -Wait -PassThru
          if ($roomProbe.ExitCode -ne 0) { throw "packaged RamyaniGameServer.exe room test failed: $($roomProbe.ExitCode)" }
          $runtimeProbe = Start-Process -FilePath $exe -ArgumentList "--board-runtime-probe" -Wait -PassThru
          if ($runtimeProbe.ExitCode -ne 0) { throw "packaged RamyaniGameServer.exe board runtime test failed: $($runtimeProbe.ExitCode)" }
          Write-Host "Packaged EXE: $exe"
          Write-Host "Config: $config"

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: RamyaniGameServer-Windows-x64-v0.2.0
          path: bridge/dist/RamyaniGameServer/**
          if-no-files-found: error
          retention-days: 30
