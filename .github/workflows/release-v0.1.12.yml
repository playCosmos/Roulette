name: Release v0.1.12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "release/v0.1.12.md"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check soop-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop-channel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop-overlay-connection.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop-overlay.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop-overlay-archive.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bridge
        working-directory: bridge
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run bridge self-tests
        working-directory: bridge
        shell: pwsh
        run: |
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-d-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-e-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-f-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --encoding-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows tray package
        working-directory: bridge
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.1.12 -SkipBuild

      - name: Verify packaged executable
        working-directory: bridge
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/RouletteBridge"
          $exe = Join-Path $root "RouletteBridge.exe"
          $config = Join-Path $root "config.json"
          $runtime = Join-Path $root "runtime/bin/server/jvm.dll"
          if (-not (Test-Path $exe)) { throw "RouletteBridge.exe missing" }
          if (-not (Test-Path $config)) { throw "config.json missing" }
          if (-not (Test-Path $runtime)) { throw "bundled Java runtime missing" }
          if (-not (Test-Path (Join-Path $root "restart-bridge.ps1"))) { throw "restart-bridge.ps1 missing from package" }
          $configJson = Get-Content $config -Raw | ConvertFrom-Json
          if (-not [string]::IsNullOrWhiteSpace([string]$configJson.streamerId)) { throw "distribution streamerId must be empty" }
          if ([string]$configJson.ticket.issuanceMode -ne "single_donation") { throw "distribution issuanceMode must default to single_donation" }
          @(
            "web/soop-admin.html",
            "web/soop-admin.js",
            "web/soop-admin.css",
            "web/soop-channel.html",
            "web/soop-channel.js",
            "web/soop-channel.css",
            "web/soop-overlay-connection.js",
            "web/soop-overlay.js",
            "web/soop-overlay-archive.js"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "required packaged asset missing: $_" }
          }
          if (Test-Path (Join-Path $root "logs")) { throw "logs directory must not be pre-created in distribution" }

          $phaseF = Start-Process -FilePath $exe -ArgumentList "--phase-f-probe" -Wait -PassThru
          if ($phaseF.ExitCode -ne 0) { throw "packaged EXE phase-f probe failed: $($phaseF.ExitCode)" }
          $encoding = Start-Process -FilePath $exe -ArgumentList "--encoding-probe" -Wait -PassThru
          if ($encoding.ExitCode -ne 0) { throw "packaged EXE encoding probe failed: $($encoding.ExitCode)" }

      - name: Create release ZIPs
        working-directory: bridge
        shell: pwsh
        run: |
          $fullZip = Join-Path $PWD "RouletteBridge-Windows-x64-v0.1.12.zip"
          Compress-Archive -Path "dist/RouletteBridge/*" -DestinationPath $fullZip -Force

          $patchRoot = Join-Path $PWD "patch-v0.1.12"
          Remove-Item $patchRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $patchRoot | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $patchRoot "web") | Out-Null

          Copy-Item "dist/RouletteBridge/RouletteBridge.exe" (Join-Path $patchRoot "RouletteBridge.exe") -Force
          Copy-Item "dist/RouletteBridge/app" (Join-Path $patchRoot "app") -Recurse -Force
          @("soop-admin.html", "soop-admin.css", "soop-admin.js") | ForEach-Object {
            Copy-Item (Join-Path "dist/RouletteBridge/web" $_) (Join-Path (Join-Path $patchRoot "web") $_) -Force
          }

          $patchReadme = @"
          RouletteBridge v0.1.12 patch for v0.1.11
          ========================================

          1. RouletteBridge를 트레이 메뉴에서 완전히 종료합니다.
          2. 기존 설치 폴더를 백업합니다.
          3. 이 ZIP의 내용을 기존 RouletteBridge v0.1.11 설치 폴더에 덮어씁니다.
          4. RouletteBridge.exe를 다시 실행합니다.

          이 패치에는 config.json, data/, tickets/, backups/, runtime/가 포함되지 않습니다.
          기존 스트리머 설정과 운영 데이터는 그대로 유지됩니다.
          기존 config.json에 issuanceMode가 없어도 v0.1.12에서는 기본값 single_donation으로 해석합니다.
          관리자 페이지에서 발급 기준을 저장하면 issuanceMode가 config.json에 기록됩니다.
          "@
          Set-Content -Path (Join-Path $patchRoot "PATCH_README.txt") -Value $patchReadme -Encoding UTF8

          $patchZip = Join-Path $PWD "RouletteBridge-Patch-v0.1.11-to-v0.1.12.zip"
          Compress-Archive -Path "$patchRoot/*" -DestinationPath $patchZip -Force

          Get-FileHash $fullZip -Algorithm SHA256 | Format-List
          Get-FileHash $patchZip -Algorithm SHA256 | Format-List

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouletteBridge-v0.1.12-release-assets
          path: |
            bridge/RouletteBridge-Windows-x64-v0.1.12.zip
            bridge/RouletteBridge-Patch-v0.1.11-to-v0.1.12.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fullZip = Join-Path $PWD "bridge/RouletteBridge-Windows-x64-v0.1.12.zip"
          $patchZip = Join-Path $PWD "bridge/RouletteBridge-Patch-v0.1.11-to-v0.1.12.zip"
          $notes = Join-Path $PWD "release/v0.1.12.md"
          gh release create v0.1.12 $fullZip $patchZip `
            --repo "${{ github.repository }}" `
            --title "RouletteBridge v0.1.12" `
            --notes-file $notes `
            --target "${{ github.sha }}" `
            --latest
