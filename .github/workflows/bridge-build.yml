name: Bridge Build

on:
  push:
    paths:
      - "bridge/**"
      - "soop-overlay.html"
      - "soop/**"
      - "soop-channel.html"
      - ".github/workflows/bridge-build.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "soop-overlay.html"
      - "soop/**"
      - "soop-channel.html"
      - ".github/workflows/bridge-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check browser JavaScript
        shell: pwsh
        run: |
          node --check soop/channel/soop-channel.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/overlay/soop-overlay-archive.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build bridge
        working-directory: bridge
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify phase D issuance
        working-directory: bridge
        run: java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-d-probe

      - name: Verify phase E archive
        working-directory: bridge
        run: java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-e-probe

      - name: Verify phase F recovery
        working-directory: bridge
        run: java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-f-probe

      - name: Probe configured SOOP streamer
        id: soop_probe
        if: ${{ vars.SOOP_PROBE_STREAMER_ID != '' }}
        continue-on-error: true
        timeout-minutes: 2
        working-directory: bridge
        run: java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --probe "${{ vars.SOOP_PROBE_STREAMER_ID }}"

      - name: Report probe result
        if: ${{ vars.SOOP_PROBE_STREAMER_ID != '' }}
        shell: pwsh
        run: Write-Host "SOOP live probe outcome = ${{ steps.soop_probe.outcome }}"