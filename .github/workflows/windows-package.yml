name: Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "assets/**"
      - "soop-overlay.html"
      - "soop-overlay.css"
      - "soop-overlay.js"
      - "soop-overlay-archive.js"
      - "soop-admin.html"
      - "soop-admin.css"
      - "soop-admin.js"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build bridge
        working-directory: bridge
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Run bridge self-tests
        working-directory: bridge
        shell: pwsh
        run: |
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-d-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-e-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --phase-f-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/roulette-bridge-0.1.0-SNAPSHOT.jar --encoding-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows portable app
        working-directory: bridge
        shell: pwsh
        run: ./package-windows.ps1 -Version 0.1.1 -SkipBuild

      - name: Verify packaged executable and config
        working-directory: bridge
        shell: pwsh
        run: |
          $root = Resolve-Path "dist/RouletteBridge"
          $exe = Join-Path $root "RouletteBridge.exe"
          $config = Join-Path $root "config.json"
          $runtime = Join-Path $root "runtime/bin/server/jvm.dll"
          if (-not (Test-Path $exe)) { throw "RouletteBridge.exe missing" }
          if (-not (Test-Path $config)) { throw "config.json missing" }
          if (-not (Test-Path $runtime)) { throw "bundled Java runtime missing" }
          & $exe --phase-f-probe
          if ($LASTEXITCODE -ne 0) { throw "packaged RouletteBridge.exe self-test failed: $LASTEXITCODE" }
          & $exe --encoding-probe
          if ($LASTEXITCODE -ne 0) { throw "packaged RouletteBridge.exe encoding test failed: $LASTEXITCODE" }
          Write-Host "Packaged EXE: $exe"
          Write-Host "Config: $config"

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: RouletteBridge-Windows-x64
          path: bridge/dist/RouletteBridge/**
          if-no-files-found: error
          retention-days: 30
