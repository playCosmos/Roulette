name: Ramyani Games Server Windows Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "games/board/**"
      - "board-admin.html"
      - "board-room.html"
      - "soop/admin/soop-admin.css"
      - "soop/admin/board-room-admin.css"
      - "soop/admin/board-room-admin.js"
      - "soop/admin/board-room-operation.css"
      - "soop/admin/board-room-operation.js"
      - ".github/workflows/board-server-windows-package.yml"
      - "bridge/package-games-server-windows.ps1"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check board browser JavaScript
        shell: pwsh
        run: |
          node --check soop/admin/board-room-admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check soop/admin/board-room-operation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/throw-presentation.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/board.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check games/board/js/board-rect.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build shared server core
        working-directory: bridge
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify existing board room/runtime logic
        working-directory: bridge
        shell: pwsh
        run: |
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --room-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -jar target/ramyani-game-server-0.2.0-SNAPSHOT.jar --board-runtime-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/ramyani-game-server-0.2.0-SNAPSHOT.jar io.github.playcosmos.roulettebridge.boardserver.BoardGameServerMain --board-server-probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/ramyani-game-server-0.2.0-SNAPSHOT.jar io.github.playcosmos.roulettebridge.room.MixedMovementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/ramyani-game-server-0.2.0-SNAPSHOT.jar io.github.playcosmos.roulettebridge.room.RoomOperationProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/ramyani-game-server-0.2.0-SNAPSHOT.jar io.github.playcosmos.roulettebridge.boardserver.ClientBoundaryProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp target/ramyani-game-server-0.2.0-SNAPSHOT.jar io.github.playcosmos.roulettebridge.boardserver.ServerManagementProbe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build games server Windows app
        working-directory: bridge
        shell: pwsh
        run: ./package-games-server-windows.ps1 -Version 0.7.0 -SkipBuild

      - name: Verify games server package
        working-directory: bridge
        shell: pwsh
        run: |
          $root = Resolve-Path "dist-games/RamyaniGamesServer"
          $exe = Join-Path $root "RamyaniGamesServer.exe"
          if (-not (Test-Path $exe)) { throw "RamyaniGamesServer.exe missing" }
          if (-not (Test-Path (Join-Path $root "config.json"))) { throw "config.json missing" }
          if (-not (Test-Path (Join-Path $root "runtime/bin/server/jvm.dll"))) { throw "bundled runtime missing" }
          @(
            "web/server-management.html",
            "web/board-admin.html",
            "web/board-room.html",
            "web/soop/admin/soop-admin.css",
            "web/soop/admin/board-room-admin.css",
            "web/soop/admin/board-room-admin.js",
            "web/soop/admin/board-room-operation.css",
            "web/soop/admin/board-room-operation.js",
            "web/games/board/index.html",
            "web/games/board/rect.html",
            "web/games/board/js/board.js",
            "web/games/board/js/board-rect.js"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "required board asset missing: $_" }
          }

          @(
            "web/soop-overlay.html",
            "web/soop-channel.html",
            "web/assets",
            "tickets",
            "backups"
          ) | ForEach-Object {
            if (Test-Path (Join-Path $root $_)) { throw "roulette-only asset must not exist: $_" }
          }

          $probe = Start-Process -FilePath $exe -ArgumentList "--board-server-probe" -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw "packaged board server probe failed: $($probe.ExitCode)" }

      - name: Upload games server package
        uses: actions/upload-artifact@v4
        with:
          name: RamyaniGamesServer-Windows-x64-v0.7.0
          path: bridge/dist-games/RamyaniGamesServer/**
          if-no-files-found: error
          retention-days: 30
